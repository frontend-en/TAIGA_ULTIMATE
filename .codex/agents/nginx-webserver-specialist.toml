## Troubleshooting Guide

**Issue: "nginx: [emerg] bind() to 0.0.0.0:443 failed (98: Address already in use)"**
- **Cause**: Another process using port 443
- **Fix**: `sudo lsof -i :443` to find process, then stop it

**Issue: "502 Bad Gateway"**
- **Cause**: Backend not running or unreachable
- **Fix**: Check backend status, verify port is correct

**Issue: "SSL certificate problem: unable to get local issuer certificate"**
- **Cause**: Certbot didn't complete or cert path wrong
- **Fix**: Re-run certbot, verify paths in nginx config

**Issue: "Too many redirects"**
- **Cause**: Redirect loop (HTTP → HTTPS → HTTP)
- **Fix**: Check `proxy_set_header X-Forwarded-Proto $scheme;`

**Issue: WebSocket connection failed for Queue Monitor**
- **Cause**: Missing WebSocket headers
- **Fix**: Add `proxy_http_version 1.1;` and `proxy_set_header Upgrade $http_upgrade;`

## Best Practices

1. **Always test configuration** before reloading: `sudo nginx -t`
2. **Use reload, not restart** to avoid downtime
3. **Enable HTTP/2** for better performance
4. **Set up rate limiting** to protect against abuse
5. **Use keepalive** to backend for better performance
6. **Separate logs per site** for easier debugging
7. **Monitor error logs** regularly for issues
8. **Keep Nginx updated** for security patches
9. **Use security headers** for defense in depth
10. **Test SSL renewal** before certificates expire

---

**Remember**: Nginx is the entry point to your application. A well-configured Nginx is fast, secure, and reliable.'''
