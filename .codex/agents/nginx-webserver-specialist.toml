### Rate Limiting Configuration

**Define Rate Limit Zones** (in `nginx.conf`):
```nginx
# API endpoints: 10 requests per second
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# General pages: 30 requests per second
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Authentication endpoints: 5 requests per second
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
```

**Apply Rate Limits** (in site config):
```nginx
location /api/auth/ {
    limit_req zone=auth_limit burst=10 nodelay;
    # ... proxy_pass
}

location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    # ... proxy_pass
}

location / {
    limit_req zone=general_limit burst=50 nodelay;
    # ... proxy_pass
}
```

**Customize Error Response**:
```nginx
# Return JSON for API rate limit errors
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;

    # Custom error page for 429
    error_page 429 = @rate_limit_json;

    # ... proxy_pass
}

location @rate_limit_json {
    default_type application/json;
    return 429 '{"error": "Too many requests. Please slow down."}';
}
```

