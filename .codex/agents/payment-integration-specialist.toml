### Webhook Setup

**1. Configure Webhook Endpoint in Stripe Dashboard**:
- Dashboard → Developers → Webhooks → Add endpoint
- Endpoint URL: `https://test.devar.ai/api/webhooks/stripe`
- Events to send:
  - `customer.subscription.created`
  - `customer.subscription.updated`
  - `customer.subscription.deleted`
  - `invoice.payment_succeeded`
  - `invoice.payment_failed`
  - `checkout.session.completed`
- Add endpoint → Copy **Signing Secret**: `whsec_***`

**2. Backend Webhook Handler**:

```javascript
const express = require('express');
const stripe = require('stripe')(process.env.STRIPE_SECRET_KEY);
const router = express.Router();

const endpointSecret = process.env.STRIPE_WEBHOOK_SECRET;

/**
 * POST /api/webhooks/stripe
 * Handle Stripe webhook events
 */
router.post('/stripe', express.raw({ type: 'application/json' }), async (req, res) => {
  const sig = req.headers['stripe-signature'];
  let event;

  try {
    // Verify webhook signature
    event = stripe.webhooks.constructEvent(req.body, sig, endpointSecret);
  } catch (err) {
    console.error('Webhook signature verification failed:', err.message);
    return res.status(400).send(`Webhook Error: ${err.message}`);
  }

  // Handle the event
  try {
    switch (event.type) {
      case 'customer.subscription.created':
        await handleSubscriptionCreated(event.data.object);
        break;

      case 'customer.subscription.updated':
        await handleSubscriptionUpdated(event.data.object);
        break;

      case 'customer.subscription.deleted':
        await handleSubscriptionDeleted(event.data.object);
        break;

      case 'invoice.payment_succeeded':
        await handlePaymentSucceeded(event.data.object);
        break;

      case 'invoice.payment_failed':
        await handlePaymentFailed(event.data.object);
        break;

      case 'checkout.session.completed':
        await handleCheckoutCompleted(event.data.object);
        break;

      default:
        console.log(`Unhandled event type: ${event.type}`);
    }

    // Return 200 to acknowledge receipt
    res.json({ received: true });
  } catch (error) {
    console.error('Webhook handler error:', error);
    // Return 500 to trigger Stripe retry
    res.status(500).json({ error: 'Webhook processing failed' });
  }
});

/**
 * Handle subscription created event
 */
async function handleSubscriptionCreated(subscription) {
  const userId = subscription.metadata.userId;
  const priceId = subscription.items.data[0].price.id;

  // Determine plan based on price ID
  let plan = 'free';
  if (priceId === process.env.STRIPE_PRICE_ID_PRO) {
    plan = 'pro';
  } else if (priceId === process.env.STRIPE_PRICE_ID_ULTIMATE) {
    plan = 'ultimate';
  }

  // Update user in database
  await User.findByIdAndUpdate(userId, {
    subscriptionPlan: plan,
    subscriptionStatus: subscription.status,
    stripeSubscriptionId: subscription.id,
    subscriptionCurrentPeriodEnd: new Date(subscription.current_period_end * 1000)
  });

  console.log(`Subscription created for user ${userId}: ${plan}`);
}

/**
 * Handle subscription updated event (upgrade, downgrade, renewal)
 */
async function handleSubscriptionUpdated(subscription) {
  const userId = subscription.metadata.userId;
  const priceId = subscription.items.data[0].price.id;

  let plan = 'free';
  if (priceId === process.env.STRIPE_PRICE_ID_PRO) {
    plan = 'pro';
  } else if (priceId === process.env.STRIPE_PRICE_ID_ULTIMATE) {
    plan = 'ultimate';
  }

  await User.findByIdAndUpdate(userId, {
    subscriptionPlan: plan,
    subscriptionStatus: subscription.status,
    subscriptionCurrentPeriodEnd: new Date(subscription.current_period_end * 1000)
  });

  console.log(`Subscription updated for user ${userId}: ${plan}, status: ${subscription.status}`);
}

/**
 * Handle subscription deleted event (cancellation)
 */
async function handleSubscriptionDeleted(subscription) {
  const userId = subscription.metadata.userId;

  await User.findByIdAndUpdate(userId, {
    subscriptionPlan: 'free',
    subscriptionStatus: 'canceled',
    stripeSubscriptionId: null,
    subscriptionCurrentPeriodEnd: null
  });

  console.log(`Subscription canceled for user ${userId}`);
}

/**
 * Handle successful payment
 */
async function handlePaymentSucceeded(invoice) {
  const customerId = invoice.customer;
  const amountPaid = invoice.amount_paid / 100; // Convert from cents

  // Log payment
  console.log(`Payment succeeded: $${amountPaid} for customer ${customerId}`);

  // Optional: Send thank you email
  // await sendPaymentSuccessEmail(customerId, amountPaid);
}

/**
 * Handle failed payment
 */
async function handlePaymentFailed(invoice) {
  const customerId = invoice.customer;

  // Find user
  const user = await User.findOne({ stripeCustomerId: customerId });

  if (user) {
    // Send payment failed email
    console.log(`Payment failed for user ${user._id}`);
    // await sendPaymentFailedEmail(user.email);

    // Optionally downgrade after multiple failures
    // Check invoice.attempt_count
  }
}

/**
 * Handle checkout session completed
 */
async function handleCheckoutCompleted(session) {
  const userId = session.metadata.userId;
  console.log(`Checkout completed for user ${userId}`);
  // Subscription will be handled by subscription.created event
}

module.exports = router;
```

