### Checkout Integration

**Backend Endpoint: Create Checkout Session**:

```javascript
const express = require('express');
const stripe = require('stripe')(process.env.STRIPE_SECRET_KEY);
const router = express.Router();

/**
 * POST /api/checkout/create-session
 * Create Stripe Checkout Session for subscription
 */
router.post('/create-session', async (req, res) => {
  try {
    const { priceId, userId } = req.body;

    // Validate input
    if (!priceId || !userId) {
      return res.status(400).json({ error: 'priceId and userId required' });
    }

    // Get or create Stripe customer
    const user = await User.findById(userId);
    let customerId = user.stripeCustomerId;

    if (!customerId) {
      const customer = await stripe.customers.create({
        email: user.email,
        metadata: {
          userId: user._id.toString()
        }
      });
      customerId = customer.id;
      user.stripeCustomerId = customerId;
      await user.save();
    }

    // Create Checkout Session
    const session = await stripe.checkout.sessions.create({
      customer: customerId,
      mode: 'subscription',
      line_items: [
        {
          price: priceId,
          quantity: 1
        }
      ],
      success_url: `${process.env.FRONTEND_URL}/settings/billing?success=true&session_id={CHECKOUT_SESSION_ID}`,
      cancel_url: `${process.env.FRONTEND_URL}/settings/billing?canceled=true`,
      metadata: {
        userId: userId
      },
      subscription_data: {
        metadata: {
          userId: userId
        }
      }
    });

    res.json({ sessionId: session.id, url: session.url });
  } catch (error) {
    console.error('Stripe Checkout error:', error);
    res.status(500).json({ error: 'Failed to create checkout session' });
  }
});

module.exports = router;
```

**Frontend: Redirect to Checkout**:

```javascript
// pages/settings/billing.tsx
import { loadStripe } from '@stripe/stripe-js';

const stripePromise = loadStripe(process.env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY);

async function handleSubscribe(priceId: string) {
  try {
    // Create checkout session
    const response = await fetch('/api/checkout/create-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        priceId,
        userId: user.id
      })
    });

    const { sessionId } = await response.json();

    // Redirect to Stripe Checkout
    const stripe = await stripePromise;
    const { error } = await stripe.redirectToCheckout({ sessionId });

    if (error) {
      console.error('Stripe redirect error:', error);
      alert('Failed to redirect to checkout');
    }
  } catch (error) {
    console.error('Checkout error:', error);
    alert('Failed to start checkout');
  }
}

// UI
<button onClick={() => handleSubscribe('price_1OabcdEFghijKLmnOP')}>
  Subscribe to Pro ($29/mo)
</button>
