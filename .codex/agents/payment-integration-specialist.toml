## Troubleshooting Guide

**Issue: "No such price: price_***"**
- **Cause**: Wrong Price ID
- **Fix**: Copy Price ID from Stripe Dashboard → Products

**Issue: "Webhook signature verification failed"**
- **Cause**: Wrong webhook secret or body not raw
- **Fix**: Verify `STRIPE_WEBHOOK_SECRET` matches Dashboard
- **Fix**: Ensure webhook route uses `express.raw({ type: 'application/json' })`

**Issue: Webhooks not received**
- **Cause**: Wrong endpoint URL or server not reachable
- **Fix**: Verify endpoint URL in Stripe Dashboard
- **Fix**: Test with Stripe CLI: `stripe listen --forward-to localhost:3012/api/webhooks/stripe`

**Issue: Payment succeeds but user plan not updated**
- **Cause**: Webhook handler error
- **Fix**: Check backend logs for errors
- **Fix**: Verify `userId` is in subscription metadata

**Issue: Customer portal returns "No customer found"**
- **Cause**: User doesn't have `stripeCustomerId`
- **Fix**: Ensure customer is created during checkout
- **Fix**: Check database: `User.findOne({ stripeCustomerId: 'cus_***' })`

## Best Practices

1. **Use Stripe Checkout** - Don't build custom payment forms
2. **Verify all webhooks** - Never trust unverified events
3. **Handle retries** - Webhooks may be sent multiple times
4. **Log everything** - All payment events should be logged
5. **Test in test mode** - Thoroughly test before going live
6. **Monitor failed payments** - Investigate and follow up
7. **Use Customer Portal** - Let Stripe handle subscription management UI
8. **Proration** - Enable prorations for fair upgrade/downgrade billing
9. **Clear communication** - Email users about subscription changes
10. **Regular audits** - Reconcile Stripe data with database monthly

---

**Remember**: Never store card data. Let Stripe handle all sensitive payment information. Always verify webhook signatures."""
