### Subscription Management

**Cancel Subscription**:

```javascript
/**
 * POST /api/billing/cancel-subscription
 * Cancel subscription at period end
 */
router.post('/cancel-subscription', async (req, res) => {
  try {
    const { userId } = req.body;

    const user = await User.findById(userId);
    if (!user || !user.stripeSubscriptionId) {
      return res.status(400).json({ error: 'No active subscription' });
    }

    // Cancel at period end (don't cancel immediately)
    const subscription = await stripe.subscriptions.update(
      user.stripeSubscriptionId,
      {
        cancel_at_period_end: true
      }
    );

    res.json({
      success: true,
      cancelsAt: new Date(subscription.cancel_at * 1000)
    });
  } catch (error) {
    console.error('Cancel subscription error:', error);
    res.status(500).json({ error: 'Failed to cancel subscription' });
  }
});
```

**Upgrade/Downgrade Subscription**:

```javascript
/**
 * POST /api/billing/change-plan
 * Upgrade or downgrade subscription
 */
router.post('/change-plan', async (req, res) => {
  try {
    const { userId, newPriceId } = req.body;

    const user = await User.findById(userId);
    if (!user || !user.stripeSubscriptionId) {
      return res.status(400).json({ error: 'No active subscription' });
    }

    const subscription = await stripe.subscriptions.retrieve(
      user.stripeSubscriptionId
    );

    // Update subscription with new price
    const updatedSubscription = await stripe.subscriptions.update(
      user.stripeSubscriptionId,
      {
        items: [{
          id: subscription.items.data[0].id,
          price: newPriceId
        }],
        proration_behavior: 'create_prorations' // Charge/credit difference
      }
    );

    res.json({
      success: true,
      newPlan: updatedSubscription.items.data[0].price.id
    });
  } catch (error) {
    console.error('Change plan error:', error);
    res.status(500).json({ error: 'Failed to change plan' });
  }
});
```

### Security & Compliance

**PCI DSS Compliance**:
- ✅ Use Stripe.js and Checkout (Stripe handles card data)
- ✅ Never store card numbers in your database
- ✅ Use HTTPS for all payment pages
- ✅ Validate webhook signatures
- ✅ Use environment variables for API keys

**API Key Security**:
- Use **Restricted Keys** in production:
  - Dashboard → Developers → API keys → Create restricted key
  - Permissions: Only what's needed (e.g., write for customers, subscriptions)
- Never commit keys to git (use `.env`)
- Rotate keys if compromised

**Idempotency** (prevent duplicate charges):

```javascript
// Use idempotency key for critical operations
const idempotencyKey = `${userId}-${Date.now()}`;

await stripe.charges.create(
  {
    amount: 2900,
    currency: 'usd',
    source: 'tok_visa',
    description: 'Pro Plan Subscription'
  },
  {
    idempotency_key: idempotencyKey
  }
);
```

