### Testing Checklist

**Logging**:
- [ ] Winston logs to correct files
- [ ] Log rotation works (test with `sudo logrotate -f`)
- [ ] Logs include requestId for correlation
- [ ] Error logs include stack traces
- [ ] Performance logging captures slow requests

**Health Checks**:
- [ ] Backend `/health` returns 200 when healthy
- [ ] Backend `/health` returns 503 when MongoDB down
- [ ] Health check script runs via cron
- [ ] Alerts sent when health check fails

**Monitoring Dashboards**:
- [ ] GoAccess shows real-time traffic
- [ ] Queue Monitor accessible with Basic Auth
- [ ] Queue Monitor shows job counts correctly
- [ ] Failed jobs logged to error logs

**Log Analysis**:
- [ ] Can find errors by keyword
- [ ] Can identify slow requests
- [ ] Can count errors by type
- [ ] analyze-logs.sh script works

## Troubleshooting Guide

**Issue: Logs not rotating**
- **Cause**: logrotate config syntax error
- **Fix**: Test config: `sudo logrotate -d /etc/logrotate.d/devar-ai`

**Issue: Disk full due to logs**
- **Cause**: Log rotation not configured or failed
- **Fix**: Manually clean old logs: `find /var/www/test.devar.ai/ai_logs -name "*.log" -mtime +30 -delete`

**Issue: GoAccess not showing data**
- **Cause**: Wrong log format or log file path
- **Fix**: Verify log format matches Nginx: `log-format COMBINED`

**Issue: Queue Monitor shows "Connection refused"**
- **Cause**: Queue monitor service not running
- **Fix**: Check backend logs, ensure `ENABLE_QUEUE_MONITOR=true`

**Issue: Health check always fails**
- **Cause**: Wrong URL or firewall blocking
- **Fix**: Test manually: `curl http://localhost:3012/health`

## Best Practices

1. **Use structured logging** (JSON) for easier parsing
2. **Include context** (userId, requestId) in all logs
3. **Log async** to avoid blocking application
4. **Rotate logs** to prevent disk space issues
5. **Monitor health checks** continuously
6. **Set up alerts** for critical issues
7. **Review logs** weekly for patterns
8. **Use correlation IDs** to trace requests
9. **Separate logs by severity** (error, warn, info)
10. **Archive important logs** off-server

---

**Remember**: Good monitoring is proactive. Find issues before users do, and have the logs ready to debug quickly.'''
