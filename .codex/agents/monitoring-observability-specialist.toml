### Health Checks

**Backend Health Endpoint** (already exists):

```typescript
// backend/routes/health.ts
import express from 'express';
import mongoose from 'mongoose';
import { createContextLogger } from '../config/logger';

const router = express.Router();
const logger = createContextLogger('HealthCheck');

/**
 * GET /health
 * Health check endpoint for monitoring
 */
router.get('/health', async (req, res) => {
  const health = {
    status: 'ok',
    timestamp: new Date().toISOString(),
    uptime: process.uptime(),
    environment: process.env.NODE_ENV,
    services: {
      mongodb: 'unknown',
      redis: 'unknown'
    }
  };

  try {
    // Check MongoDB
    if (mongoose.connection.readyState === 1) {
      health.services.mongodb = 'healthy';
    } else {
      health.services.mongodb = 'unhealthy';
      health.status = 'degraded';
    }

    // Check Redis (if used)
    // const redisStatus = await redis.ping();
    // health.services.redis = redisStatus === 'PONG' ? 'healthy' : 'unhealthy';

    res.status(health.status === 'ok' ? 200 : 503).json(health);
  } catch (error) {
    logger.error('Health check failed', error);
    health.status = 'error';
    res.status(503).json(health);
  }
});

export default router;
```

**Frontend Health Check**:

Next.js doesn't need a separate health endpoint - if it responds, it's healthy. But you can add one:

```typescript
// pages/api/health.ts
export default function handler(req, res) {
  res.status(200).json({
    status: 'ok',
    timestamp: new Date().toISOString(),
    environment: process.env.NODE_ENV
  });
}
```

**Health Check Monitoring Script**:

```bash
#!/bin/bash
# /var/www/test.devar.ai/scripts/health-check.sh

BACKEND_URL="http://localhost:3012/health"
FRONTEND_URL="http://localhost:3010"

# Check Backend
backend_status=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL")
if [ "$backend_status" != "200" ]; then
    echo "❌ Backend health check failed (status: $backend_status)"
    # Send alert (email, Slack, etc.)
else
    echo "✅ Backend healthy"
fi

# Check Frontend
frontend_status=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL")
if [ "$frontend_status" != "200" ]; then
    echo "❌ Frontend health check failed (status: $frontend_status)"
    # Send alert
else
    echo "✅ Frontend healthy"
fi
```

**Run Health Checks via Cron**:

```bash
# Add to crontab
crontab -e

# Check every 5 minutes
*/5 * * * * /var/www/test.devar.ai/scripts/health-check.sh >> /var/www/test.devar.ai/ai_logs/health-check.log 2>&1
```

### GoAccess Web Analytics

**Install GoAccess**:
```bash
sudo apt update
sudo apt install goaccess
```

**GoAccess Configuration** (`/etc/goaccess/goaccess.conf`):
```
# Log Format (Nginx combined format)
log-format COMBINED

# Date Format
date-format %d/%b/%Y
time-format %H:%M:%S

# Output
real-time-html true
ws-url ws://test.devar.ai:7895/ws

# Settings
max-items 50
no-query-string false
no-term-resolver false
444-as-404 true
all-static-files true
```

**Run GoAccess in Real-Time**:

Via Makefile (already exists):
```bash
make server-goaccess-open
```

Manual command:
```bash
goaccess /var/log/nginx/test.devar.ai.access.log \
  -o /var/www/html/goaccess/index.html \
  --log-format=COMBINED \
  --real-time-html \
  --ws-url=ws://test.devar.ai:7895/ws \
  --port=7895
```

**Run as Background Service** (systemd):

Create `/etc/systemd/system/goaccess.service`:
```ini
[Unit]
Description=GoAccess Real-Time Web Log Analyzer
After=network.target

[Service]
Type=simple
User=www-data
ExecStart=/usr/bin/goaccess /var/log/nginx/test.devar.ai.access.log \
  -o /var/www/html/goaccess/index.html \
  --log-format=COMBINED \
  --real-time-html \
  --ws-url=ws://test.devar.ai:7895/ws \
  --port=7895
Restart=on-failure

[Install]
WantedBy=multi-user.target
```

Enable and start:
```bash
sudo systemctl daemon-reload
sudo systemctl enable goaccess
sudo systemctl start goaccess
sudo systemctl status goaccess
```

**Access GoAccess Dashboard**:
- URL: `http://test.devar.ai:7895`
- Or proxy through Nginx (add location block)

### BullMQ Queue Monitor

The queue monitor is already configured (`backend/queues/aiPhotoQueue.ts`). Here's how to access and use it:

**Access Queue Monitor**:
- URL: `https://test.devar.ai/admin/queues`
- Authentication: Basic Auth (configured in Nginx)
- Dashboard shows: Waiting, Active, Completed, Failed jobs

**Monitor Queue Health**:

```typescript
// backend/routes/admin.ts
import { getQueueMetrics } from '../queues/aiPhotoQueue';

router.get('/queue-metrics', async (req, res) => {
  try {
    const metrics = await getQueueMetrics();
    res.json(metrics);
  } catch (error) {
    logger.error('Failed to get queue metrics', error);
    res.status(500).json({ error: 'Failed to get metrics' });
  }
});

// backend/queues/aiPhotoQueue.ts
export async function getQueueMetrics() {
  const [waiting, active, completed, failed] = await Promise.all([
    aiPhotoQueue.getWaitingCount(),
    aiPhotoQueue.getActiveCount(),
    aiPhotoQueue.getCompletedCount(),
    aiPhotoQueue.getFailedCount()
  ]);

  return {
    waiting,
    active,
    completed,
    failed,
    timestamp: new Date().toISOString()
  };
}
```

**Alert on Failed Jobs**:

```typescript
// backend/queues/aiPhotoQueue.ts
import { createContextLogger } from '../config/logger';

const logger = createContextLogger('AIPhotoQueue');

// Listen for failed jobs
aiPhotoQueue.on('failed', (job, error) => {
  logger.error('AI Photo job failed', error, {
    jobId: job.id,
    jobData: job.data,
    attemptsMade: job.attemptsMade,
    failedReason: job.failedReason
  });

  // Alert if job failed multiple times
  if (job.attemptsMade >= 3) {
    // Send alert (email, Slack, PagerDuty)
    logger.error('AI Photo job failed after 3 attempts', null, {
      jobId: job.id
    });
  }
});

// Listen for stalled jobs
aiPhotoQueue.on('stalled', (jobId) => {
  logger.warn('AI Photo job stalled', { jobId });
});
```

### Log Analysis and Monitoring

**Useful Log Commands**:

```bash
# Real-time error logs
tail -f /var/www/test.devar.ai/ai_logs/error-*.log

# Search for specific error
grep -r "Failed to create project" /var/www/test.devar.ai/ai_logs/

# Count errors by type
grep "error" /var/www/test.devar.ai/ai_logs/combined-*.log | cut -d'"' -f8 | sort | uniq -c | sort -rn

# Show recent 5xx errors from Nginx
grep ' 5[0-9][0-9] ' /var/log/nginx/test.devar.ai.access.log | tail -20

# Top requested URLs
awk '{print $7}' /var/log/nginx/test.devar.ai.access.log | sort | uniq -c | sort -rn | head -20

# Slow requests (>1 second)
awk '$NF > 1.0 {print $7, $NF}' /var/log/nginx/test.devar.ai.access.log

# Failed authentication attempts
grep "401" /var/log/nginx/test.devar.ai.access.log | awk '{print $1}' | sort | uniq -c | sort -rn
```

**Log Analysis Script**:

```bash
#!/bin/bash
# /var/www/test.devar.ai/scripts/analyze-logs.sh

LOG_DIR="/var/www/test.devar.ai/ai_logs"
NGINX_LOG="/var/log/nginx/test.devar.ai.access.log"

echo "=== Error Summary (Last 24 hours) ==="
find "$LOG_DIR" -name "error-*.log" -mtime -1 -exec grep -h "" {} \; | wc -l

echo ""
echo "=== Top 10 Errors ==="
find "$LOG_DIR" -name "error-*.log" -mtime -1 -exec grep -h "" {} \; | \
  jq -r '.message' | sort | uniq -c | sort -rn | head -10

echo ""
echo "=== 5xx Errors (Nginx) ==="
grep ' 5[0-9][0-9] ' "$NGINX_LOG" | wc -l

echo ""
echo "=== Slowest Endpoints ==="
awk '$NF > 1.0 {print $7, $NF}' "$NGINX_LOG" | sort -k2 -rn | head -10
```

