## Core Development Philosophy

### 1. Proactive Monitoring

- **Detect Before Users**: Find issues before users report them
- **Meaningful Alerts**: Alert only on actionable issues
- **Log Everything Important**: Comprehensive logging for debugging
- **Regular Review**: Periodically review logs and metrics

### 2. Structured Observability

- **Structured Logs**: JSON format with consistent fields
- **Correlation IDs**: Track requests across services
- **Metrics Over Time**: Historical data for trend analysis
- **Context-Rich Errors**: Include all relevant debugging information

### 3. Reliability

- **High Availability Logging**: Logging never blocks application
- **Async Operations**: Log asynchronously to avoid performance impact
- **Log Rotation**: Prevent disk space issues
- **Backup Logs**: Archive critical logs off-server

## Core Competencies

### Winston Logging Setup

The backend already has Winston configured (`backend/config/logger.ts`). Here's how to use and extend it:

**Current Winston Configuration** (review):
```typescript
// backend/config/logger.ts
import winston from 'winston';
import DailyRotateFile from 'winston-daily-rotate-file';

const logDir = process.env.LOG_DIR || './logs';
const logLevel = process.env.LOG_LEVEL || 'info';

// Define log format
const logFormat = winston.format.combine(
  winston.format.timestamp({ format: 'YYYY-MM-DD HH:mm:ss' }),
  winston.format.errors({ stack: true }),
  winston.format.splat(),
  winston.format.json()
);

// Create logger
const logger = winston.createLogger({
  level: logLevel,
  format: logFormat,
  transports: [
    // Debug logs
    new DailyRotateFile({
      filename: `${logDir}/debug-%DATE%.log`,
      datePattern: 'YYYY-MM-DD',
      level: 'debug',
      maxFiles: '14d'
    }),
    // Info logs
    new DailyRotateFile({
      filename: `${logDir}/info-%DATE%.log`,
      datePattern: 'YYYY-MM-DD',
      level: 'info',
      maxFiles: '14d'
    }),
    // Warning logs
    new DailyRotateFile({
      filename: `${logDir}/warn-%DATE%.log`,
      datePattern: 'YYYY-MM-DD',
      level: 'warn',
      maxFiles: '14d'
    }),
    // Error logs
    new DailyRotateFile({
      filename: `${logDir}/error-%DATE%.log`,
      datePattern: 'YYYY-MM-DD',
      level: 'error',
      maxFiles: '14d'
    }),
    // Combined logs
    new DailyRotateFile({
      filename: `${logDir}/combined-%DATE%.log`,
      datePattern: 'YYYY-MM-DD',
      maxFiles: '14d'
    })
  ]
});

// Console logging for development
if (process.env.NODE_ENV !== 'production') {
  logger.add(new winston.transports.Console({
    format: winston.format.combine(
      winston.format.colorize(),
      winston.format.simple()
    )
  }));
}

export function createContextLogger(context: string) {
  return {
    debug: (message: string, meta?: any) =>
      logger.debug(message, { context, ...meta }),
    info: (message: string, meta?: any) =>
      logger.info(message, { context, ...meta }),
    warn: (message: string, meta?: any) =>
      logger.warn(message, { context, ...meta }),
    error: (message: string, error?: Error, meta?: any) =>
      logger.error(message, { context, error: error?.stack, ...meta })
  };
}

export default logger;
```

**Using Context Logger** (best practice):
```typescript
// In your service/route file
import { createContextLogger } from '../config/logger';

const logger = createContextLogger('ProjectService');

// Log info
logger.info('User created project', {
  userId: user.id,
  projectId: project.id
});

// Log error
try {
  await createProject();
} catch (error) {
  logger.error('Failed to create project', error, {
    userId: user.id
  });
  throw error;
}
```

**Request Logging Middleware**:
```typescript
// backend/middleware/requestLogger.ts
import { createContextLogger } from '../config/logger';

const logger = createContextLogger('HTTPRequest');

export function requestLogger(req, res, next) {
  const start = Date.now();
  const requestId = req.headers['x-request-id'] || generateUUID();

  // Attach requestId to request
  req.requestId = requestId;

  // Log request
  logger.info('Incoming request', {
    requestId,
    method: req.method,
    url: req.url,
    ip: req.ip,
    userAgent: req.headers['user-agent']
  });

  // Log response
  res.on('finish', () => {
    const duration = Date.now() - start;
    logger.info('Request completed', {
      requestId,
      method: req.method,
      url: req.url,
      statusCode: res.statusCode,
      duration: `${duration}ms`
    });
  });

  next();
}
```

**Error Logging Middleware**:
```typescript
// backend/middleware/errorLogger.ts
import { createContextLogger } from '../config/logger';

const logger = createContextLogger('ErrorHandler');

export function errorLogger(err, req, res, next) {
  logger.error('Unhandled error', err, {
    requestId: req.requestId,
    method: req.method,
    url: req.url,
    userId: req.user?.id,
    body: req.body
  });

  res.status(err.status || 500).json({
    error: err.message || 'Internal server error',
    requestId: req.requestId
  });
}
```

### Log Rotation with logrotate

**Create logrotate Configuration**:

`/etc/logrotate.d/devar-ai`:
```
# Application logs (Winston)
/var/www/*/ai_logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 alextsknf alextsknf
    sharedscripts
    postrotate
        # Signal application to reopen log files if needed
        # Not needed for winston-daily-rotate-file
    endscript
    missingok
}

# Nginx logs
/var/log/nginx/*.log {
    daily
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 `cat /var/run/nginx.pid`
        fi
    endscript
}
```

**Test logrotate**:
```bash
# Test configuration
sudo logrotate -d /etc/logrotate.d/devar-ai

# Force rotation (for testing)
sudo logrotate -f /etc/logrotate.d/devar-ai

# Check rotated logs
ls -lh /var/www/test.devar.ai/ai_logs/
```

**Automatic Rotation** (runs daily via cron):
