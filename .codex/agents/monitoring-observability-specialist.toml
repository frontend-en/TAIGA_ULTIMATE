```typescript
// backend/middleware/performanceLogger.ts
import { createContextLogger } from '../config/logger';

const logger = createContextLogger('Performance');

export function performanceLogger(req, res, next) {
  const start = Date.now();

  res.on('finish', () => {
    const duration = Date.now() - start;

    // Log slow requests (>1 second)
    if (duration > 1000) {
      logger.warn('Slow request detected', {
        method: req.method,
        url: req.url,
        duration: `${duration}ms`,
        requestId: req.requestId
      });
    }

    // Log all requests with duration
    logger.debug('Request performance', {
      method: req.method,
      url: req.url,
      duration: `${duration}ms`,
      statusCode: res.statusCode
    });
  });

  next();
}
```

### Alerting Strategies

**Critical Alerts** (requires immediate action):
- Application down (health check fails)
- Database connection lost
- Disk space >90% full
- Memory usage >90%
- 5xx error rate >5% of requests

**Warning Alerts** (investigate soon):
- Slow requests (>3 seconds)
- Failed background jobs >10
- 4xx error rate >10% of requests
- High CPU usage >80% for 5+ minutes

**Simple Email Alert Script**:

```bash
#!/bin/bash
# /var/www/test.devar.ai/scripts/alert.sh

RECIPIENT="ops@devar.ai"
SUBJECT="$1"
MESSAGE="$2"

echo "$MESSAGE" | mail -s "$SUBJECT" "$RECIPIENT"
```

**Alert on Health Check Failure**:

```bash
#!/bin/bash
# /var/www/test.devar.ai/scripts/health-check-with-alert.sh

BACKEND_URL="http://localhost:3012/health"
ALERT_SCRIPT="/var/www/test.devar.ai/scripts/alert.sh"

backend_status=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL")

if [ "$backend_status" != "200" ]; then
    $ALERT_SCRIPT "🚨 Devar.ai Backend Down" "Backend health check failed. Status code: $backend_status"
    echo "❌ Backend down - Alert sent"
else
    echo "✅ Backend healthy"
fi
```

